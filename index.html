<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are a gay</title>
<style>
  :root {
    --bg: #fff7e6;
    --ink: #2b1b3d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1230; --ink: #fff7e6; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  .flag {
    width: min(70vw, 420px);
    height: 14px;
    border-radius: 7px;
    background: linear-gradient(90deg,
      #e40303 0 16.66%, #ff8c00 0 33.33%, #ffed00 0 50%,
      #008026 0 66.66%, #004dff 0 83.33%, #750787 0);
  }
  h1 { animation: bob 0.5s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 8vw, 4.5rem);
    line-height: 1.1;
  }
  .stage { display: flex; align-items: flex-end; justify-content: center; gap: clamp(1rem, 6vw, 3rem); }
  .fairy { width: clamp(90px, 24vw, 170px); height: auto; overflow: visible; animation: sway 1.4s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .wing { transform-origin: 60px 62px; animation: flap 0.35s ease-in-out infinite alternate; }
  .wing.r { transform-origin: 60px 62px; }
  @keyframes sway { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-8px); } }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.82); } }
  @media (prefers-reduced-motion: reduce) { .fairy, .wing { animation: none; } }
</style>
</head>
